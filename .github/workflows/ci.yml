name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin manifests + commands
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Validate JSON syntax
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if ! python -m json.tool "$f" > /dev/null; then
              echo "::error file=$f::Invalid JSON syntax"
              fail=1
            fi
          done < <(git ls-files '*.json')
          exit "$fail"

      - name: Validate marketplace + plugin manifest schemas
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          ok = True
          # marketplace.json: required keys per Claude Code plugin spec.
          with open(".claude-plugin/marketplace.json") as f:
              mp = json.load(f)
          for k in ("name", "owner", "plugins"):
              if k not in mp:
                  print(f"::error file=.claude-plugin/marketplace.json::missing key '{k}'")
                  ok = False
          # plugin.json: required keys.
          with open("plugins/speckit/.claude-plugin/plugin.json") as f:
              pj = json.load(f)
          for k in ("name", "version", "description"):
              if k not in pj:
                  print(f"::error file=plugins/speckit/.claude-plugin/plugin.json::missing key '{k}'")
                  ok = False
          sys.exit(0 if ok else 1)
          PY

      - name: Validate command + skill markdown structure
        run: |
          set -euo pipefail
          fail=0
          # Every command file under plugins/*/commands/ must be non-empty markdown.
          while IFS= read -r f; do
            if [ ! -s "$f" ]; then
              echo "::error file=$f::Empty command file"
              fail=1
            fi
          done < <(git ls-files 'plugins/*/commands/*.md')
          # Every SKILL.md must have YAML frontmatter with name + description.
          while IFS= read -r f; do
            if ! head -1 "$f" | grep -q '^---$'; then
              echo "::error file=$f::Missing YAML frontmatter opener"
              fail=1
            fi
            if ! grep -q '^name:' "$f" || ! grep -q '^description:' "$f"; then
              echo "::error file=$f::SKILL.md must include 'name:' and 'description:' frontmatter"
              fail=1
            fi
          done < <(git ls-files '**/SKILL.md')
          exit "$fail"

  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
